<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A central place to access the current application.">
  <title>Project Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6fa; color: #172338;
    }
    main {
      width: 100%; max-width: 510px; padding: 48px 36px;
      background: #fff; border: 1px solid #e3e8f0; border-radius: 24px;
      box-shadow: 0 16px 48px #17233808; text-align: center;
    }
    .icon {
      display: grid; place-items: center; width: 56px; height: 56px;
      margin: 0 auto 28px; border-radius: 16px; background: #edf2ff; color: #3156b8;
    }
    .eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; color: #59677d; }
    h1 { margin: 12px 0 16px; font-size: clamp(28px, 6vw, 36px); letter-spacing: -.04em; }
    p { margin: 0; line-height: 1.7; color: #58667a; }
    .launch {
      display: block; width: 100%; margin: 30px 0 20px; padding: 16px 20px;
      background: #3156b8; color: white; border: 0; border-radius: 12px;
      text-decoration: none; font: inherit; font-weight: 600;
    }
    a.launch:hover { background: #254493; }
    .launch:focus-visible { outline: 3px solid #172338; outline-offset: 4px; }
    .launch:disabled { background: #e8ecf2; color: #59677d; cursor: not-allowed; }
    .note { font-size: 13px; }
    footer { margin-top: 30px; padding-top: 24px; border-top: 1px solid #edf0f5; font-size: 12px; color: #657287; }
    [hidden] { display: none !important; }
    @media (max-width: 420px) { main { padding: 36px 24px; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <path d="M14 17.5h7m-3.5-3.5v7"/>
      </svg>
    </div>
    <div class="eyebrow">Welcome</div>
    <h1>Capstone AI Agent Access Portal</h1>
    <p>Access the Captstone AI Agent from one place.<br>Bookmark this page to return anytime.</p>
    <a id="launch" class="launch" hidden>Open Application <span aria-hidden="true">&rarr;</span></a>
    <button id="unavailable" class="launch" disabled>Link coming soon</button>
    <p id="note" class="note">The application link has not been added yet. Please check back later.</p>
    <noscript><p class="note">Enable JavaScript to access the application link.</p></noscript>
    <footer>NMSU School of Engineering</footer>
  </main>
  <script>
    // WEEKLY UPDATE: Paste the full HTTPS application link between the quotes.
    // Leave this empty to show "Link coming soon".
    const APPLICATION_URL = "https://clock-wallpapers-basement-mag.trycloudflare.com";

    try {
      const destination = new URL(APPLICATION_URL);
      if (destination.protocol === "https:" && !destination.username && !destination.password) {
        const launch = document.getElementById("launch");
        launch.href = destination.href;
        launch.hidden = false;
        document.getElementById("unavailable").hidden = true;
        document.getElementById("note").textContent =
          "If the application does not open, it may be restarting or undergoing maintenance. Please try again later.";
      }
    } catch {
      // Keep the unavailable state when no valid address has been supplied.
    }
  </script>
</body>
</html>
